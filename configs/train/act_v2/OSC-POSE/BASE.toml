# Original robomimic CAN PH controller commands (7-D), not achieved next states.
# Set use_z = true in a derived config to train the CVAE posterior.
version = "v4"
action_chunk_size = 10
action_mode = "osc_pose_delta"
action_loss = "l1"
batch_size = 32
steps = 100000
lr = 1e-4
seed = 0
beta = 0.01
beta_start = 0.001
beta_warmup_steps = 0
checkpoint_every = 2000
use_z = false
dataset = "datasets/can/ph/robomimic_can_ph_original_actions_agentview_robot0_eye_in_hand.hdf5"
image_keys = ["agentview_image", "robot0_eye_in_hand_image"]

[tensorboard]
activations = false
batch_metrics = true
denorm_l1 = true
epoch_metrics = true
eval = true
hyperparams = true
latent = true
lr = true
optimizer = false
ranges = false
sensitivity = false
throughput = true
timing = true

[rollout]
n_action_steps = [10]
episodes = 30
horizon = 250
seed = 0
